<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text: #f0eff5;
    --muted: #7a798a;
    --accent: #c8b8ff;
    --accent2: #7fd8b4;
    --accent3: #ffb86c;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* NOISE TEXTURE */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  /* HEADER */
  header {
    position: relative;
    z-index: 10;
    padding: 3rem 2rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2.5rem;
  }

  .logo span { color: var(--accent); }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 800;
    line-height: 1.0;
    letter-spacing: -0.03em;
    margin-bottom: 0.75rem;
  }

  h1 em {
    font-style: normal;
    color: var(--accent);
  }

  .subtitle {
    font-size: 1.05rem;
    color: var(--muted);
    font-weight: 300;
    margin-bottom: 0;
  }

  /* FILTER SECTION */
  .filter-section {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem 2.5rem;
  }

  .filter-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .filter-scroll {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    padding: 6px 14px;
    border-radius: 100px;
    border: 0.5px solid var(--border-hover);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200, 184, 255, 0.06);
  }

  .filter-btn.active {
    border-color: var(--accent);
    background: rgba(200, 184, 255, 0.12);
    color: var(--accent);
  }

  /* DIVIDER */
  .divider {
    max-width: 1200px;
    margin: 0 auto 2.5rem;
    padding: 0 2rem;
    border-top: 0.5px solid var(--border);
  }

  /* CONTINENT GRID */
  #continent-view {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .continent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .continent-card {
    background: var(--surface);
    padding: 2rem;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    position: relative;
    overflow: hidden;
  }

  .continent-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(200,184,255,0.04) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .continent-card:hover {
    background: var(--surface2);
  }

  .continent-card:hover::after { opacity: 1; }

  .continent-card.hidden { display: none; }

  .continent-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .continent-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }

  .continent-num {
    font-family: 'Syne', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    color: rgba(255,255,255,0.06);
    line-height: 1;
  }

  .continent-name {
    font-family: 'Syne', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .continent-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .continent-count {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .continent-count strong {
    color: var(--text);
    font-weight: 500;
  }

  .continent-arrow {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 0.5px solid var(--border-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.75rem;
    transition: all 0.2s;
  }

  .continent-card:hover .continent-arrow {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200, 184, 255, 0.1);
  }

  .continent-regions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .region-tag {
    font-size: 0.67rem;
    padding: 3px 8px;
    border-radius: 100px;
    background: rgba(255,255,255,0.04);
    border: 0.5px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  /* COUNTRY VIEW */
  #country-view {
    display: none;
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
  }

  .back-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    margin-bottom: 2rem;
    transition: color 0.2s;
  }

  .back-btn:hover { color: var(--text); }

  .country-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .country-header-left h2 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.4rem;
  }

  .country-header-left p {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .country-stats {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .stat-block { text-align: right; }

  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-lbl {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* REGION FILTER FOR COUNTRIES */
  .country-region-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 2rem;
  }

  /* COUNTRY GRID */
  .country-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .country-card {
    background: var(--surface);
    padding: 1.25rem 1.5rem;
    transition: background 0.2s;
  }

  .country-card:hover { background: var(--surface2); }
  .country-card.hidden { display: none; }

  .cc-flag {
    font-size: 1.6rem;
    margin-bottom: 0.75rem;
    line-height: 1;
  }

  .cc-name {
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    letter-spacing: -0.01em;
  }

  .cc-details {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cc-detail {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
  }

  .cc-detail-key {
    color: var(--muted);
    min-width: 52px;
    flex-shrink: 0;
  }

  .cc-detail-val {
    color: var(--text);
    font-weight: 400;
  }

  .cc-badge {
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 100px;
    background: rgba(127,216,180,0.1);
    border: 0.5px solid rgba(127,216,180,0.2);
    color: var(--accent2);
    margin-left: auto;
  }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 0.9rem;
    display: none;
    grid-column: 1 / -1;
    background: var(--surface);
  }

  /* SEARCH BAR */
  .search-wrap {
    position: relative;
    margin-bottom: 1.5rem;
    max-width: 360px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  #country-search {
    width: 100%;
    background: var(--surface);
    border: 0.5px solid var(--border-hover);
    border-radius: 100px;
    padding: 9px 16px 9px 38px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  #country-search:focus { border-color: var(--accent); }
  #country-search::placeholder { color: var(--muted); }

  /* GLOW BLOBS */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.12;
  }

  .blob-1 {
    width: 600px; height: 600px;
    background: #7c5cbf;
    top: -200px; right: -200px;
  }

  .blob-2 {
    width: 400px; height: 400px;
    background: #2d8a6c;
    bottom: 100px; left: -150px;
  }

  @media (max-width: 640px) {
    header { padding: 2rem 1rem 1.5rem; }
    .filter-section, .divider, #continent-view, #country-view { padding-left: 1rem; padding-right: 1rem; }
    .continent-grid, .country-grid { border-radius: 12px; }
    .stat-block { text-align: left; }
    .country-stats { gap: 1rem; }
  }
</style>
</head>

<div class="blob blob-1"></div>

<div class="divider"></div>

<!-- CONTINENT VIEW -->
<div id="continent-view">

  <div class="country-grid" id="country-grid">
    <div class="no-results" id="no-results">No countries match your search.</div>
  </div>
</div>

let activeRegion = "all";
let currentContinent = null;
let activeSubRegion = "all";

function buildContinentGrid() {
  const grid = document.getElementById("continent-grid");
  grid.innerHTML = "";
  Object.entries(DATA).forEach(([name, data], i) => {
    const card = document.createElement("div");
    card.className = "continent-card";
    card.dataset.continent = name;
    card.dataset.regions = data.regions.join(",");
    card.innerHTML = `
      <div class="continent-top">
        <div class="continent-icon" style="background:${data.color}22; color:${data.color}; font-size:1.4rem">${data.emoji}</div>
        <div class="continent-num">${String(i + 1).padStart(2,"0")}</div>
      </div>
      <div class="continent-name">${name}</div>
      <div class="continent-regions">${data.regions.map(r=>`<span class="region-tag">${r}</span>`).join("")}</div>
      <div class="continent-meta">
        <div class="continent-count"><strong>${data.countries.length}</strong> countries</div>
        <div class="continent-arrow">→</div>
      </div>
    `;
    card.addEventListener("click", () => showCountries(name));
    grid.appendChild(card);
  });
}

function applyRegionFilter(region) {
  activeRegion = region;
  document.querySelectorAll(".filter-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.region === region);
  });

  const cards = document.querySelectorAll(".continent-card");
  let anyVisible = false;
  cards.forEach(card => {
    if (region === "all") {
      card.classList.remove("hidden");
      anyVisible = true;
    } else {
      const regions = card.dataset.regions.split(",");
      const match = regions.some(r => r.trim() === region);
      card.classList.toggle("hidden", !match);
      if (match) anyVisible = true;
    }
  });
}

function showCountries(continentName) {
  currentContinent = continentName;
  activeSubRegion = "all";
  const data = DATA[continentName];

  document.getElementById("continent-view").style.display = "none";
  document.getElementById("country-view").style.display = "block";
  document.getElementById("cv-name").textContent = continentName;
  document.getElementById("cv-sub").textContent = data.regions.join(" · ");
  document.getElementById("cv-count").textContent = data.countries.length;
  document.getElementById("country-search").value = "";

  buildSubRegionFilter(data);
  buildCountryGrid(data.countries);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function buildSubRegionFilter(data) {
  const bar = document.getElementById("country-region-filter");
  bar.innerHTML = `<button class="filter-btn active" data-sub="all">All</button>`;
  data.regions.forEach(r => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.dataset.sub = r;
    btn.textContent = r;
    bar.appendChild(btn);
  });
  bar.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeSubRegion = btn.dataset.sub;
      bar.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterCountryCards();
    });
  });
}

function buildCountryGrid(countries) {
  const grid = document.getElementById("country-grid");
  grid.querySelectorAll(".country-card").forEach(c => c.remove());
  countries.forEach(c => {
    const card = document.createElement("div");
    card.className = "country-card";
    card.dataset.region = c.region;
    card.dataset.name = c.name.toLowerCase();
    card.innerHTML = `
      <div class="cc-flag">${c.flag}</div>
      <div class="cc-name">${c.name}</div>
      <div class="cc-details">
        <div class="cc-detail">
          <span class="cc-detail-key">Capital</span>
          <span class="cc-detail-val">${c.capital}</span>
        </div>
        <div class="cc-detail">
          <span class="cc-detail-key">Currency</span>
          <span class="cc-detail-val">${c.currency}</span>
        </div>
        <div class="cc-detail">
          <span class="cc-detail-key">Language</span>
          <span class="cc-detail-val">${c.language}</span>
          <span class="cc-badge">${c.region}</span>
        </div>
      </div>
    `;
    grid.insertBefore(card, document.getElementById("no-results"));
  });
}

function filterCountryCards() {
  const search = document.getElementById("country-search").value.toLowerCase();
  const cards = document.querySelectorAll(".country-card");
  let visible = 0;
  cards.forEach(card => {
    const regionMatch = activeSubRegion === "all" || card.dataset.region === activeSubRegion;
    const searchMatch = !search || card.dataset.name.includes(search);
    const show = regionMatch && searchMatch;
    card.classList.toggle("hidden", !show);
    if (show) visible++;
  });
  document.getElementById("no-results").style.display = visible === 0 ? "block" : "none";
}

function showContinents() {
  document.getElementById("country-view").style.display = "none";
  document.getElementById("continent-view").style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// INIT
buildContinentGrid();

document.getElementById("filter-bar").addEventListener("click", e => {
  if (e.target.classList.contains("filter-btn")) {
    applyRegionFilter(e.target.dataset.region);
  }
});

document.getElementById("country-search").addEventListener("input", filterCountryCards);
</script>
